name: Passage Counter v0.8.0 accuracy tooling, icon and UI regression
on:
  push:
    branches:
      - feat/passage-counter-v0.8.0
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: passage-counter-v08-${{ github.ref }}
  cancel-in-progress: true
jobs:
  accuracy-and-ui:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build two standalone files and validate embedded app assets
        shell: pwsh
        run: |
          ./scripts/check-powershell-syntax.ps1
          ./scripts/check-repository.ps1
      - name: Deterministic tracker, corrections, session, frame pacing and accuracy scoring
        shell: pwsh
        run: |
          node scripts/test-tracker.mjs
          node scripts/test-tracker-stress.mjs
          node scripts/test-ledger.mjs
          node scripts/test-session-model.mjs
          node scripts/test-performance.mjs
          node scripts/test-accuracy-evaluator.mjs
      - name: Score the explicitly synthetic harness sample (must NOT pass release gate)
        shell: pwsh
        run: |
          node scripts/evaluate-accuracy.mjs examples/accuracy/synthetic-manifest.json --json=dist/accuracy-example.json --md=dist/accuracy-example.md
          $report=Get-Content dist/accuracy-example.json -Raw | ConvertFrom-Json
          if ($report.gate.eligibleForReview) { throw "Synthetic fixture falsely passed the real-world accuracy gate." }
          if ($report.gate.standardHoldoutTruth -ge 100) { throw "Synthetic fixture is not a genuine 100-event benchmark." }
          Write-Host "[accuracy] Expected NOT VERIFIED: independent real footage and 100+ annotations not in CI."
      - name: Install CI-only Playwright browser dependency
        shell: pwsh
        run: npm install --prefix .smoke --no-save --ignore-scripts playwright@1.56.1
      - name: Verify uploaded favicon and unboxed Wi-Fi Share help UI (bilingual 320–1280px)
        shell: pwsh
        run: node scripts/smoke-header.mjs
      - name: Verify offline human annotation helper and local CSV labeling
        shell: pwsh
        run: node scripts/smoke-annotation.mjs
      - name: Regression Chrome and Edge camera, dual CSP, locales, offline
        shell: pwsh
        run: node scripts/smoke-v07-integration.mjs
      - name: Regression persisted sessions, model, crossing and CSV
        shell: pwsh
        run: node scripts/smoke-browser.mjs
      - name: Regression decoded local WebM, seek safety and exported events
        shell: pwsh
        run: node scripts/smoke-video.mjs
      - name: Regression short synthetic endurance, interrupts and Wake Lock
        shell: pwsh
        run: |
          node scripts/smoke-endurance.mjs
          node scripts/smoke-wakelock.mjs
      - name: Report distribution sizes and field accuracy blockers
        if: always()
        shell: pwsh
        run: |
          if (Test-Path dist/build-size-report.json) {
            $s=Get-Content -Raw dist/build-size-report.json | ConvertFrom-Json
            Write-Host ("[v08-size] readable={0} selfExtract={1}" -f $s.readableHtmlBytes,$s.selfExtractHtmlBytes)
          }
          Write-Host "[accuracy] No independently annotated 100+ real-world crossings included. v0.8.0 numeric accuracy gate remains open."
          Write-Host "[devices] Android Chrome / iPhone Safari 30-minute physical-device gates still open."
      - name: Upload audit evidence (7 day retention)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: passage-counter-v0.8.0-draft
          path: |
            dist/index.html
            dist/index.self-extract.html
            dist/build-size-report.json
            dist/dependency-manifest.json
            dist/accuracy-example.json
            dist/accuracy-example.md
            dist/screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
