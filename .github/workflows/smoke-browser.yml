name: Browser smoke - embedded camera runtime
on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "model.config.json"
      - "dependencies.json"
      - "dependencies.lock.json"
      - "build-standalone.ps1"
      - "scripts/**"
      - ".github/workflows/smoke-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: PowerShell syntax and encoding preflight
        shell: powershell
        run: .\scripts\check-powershell-syntax.ps1
      - name: Build standalone with pinned embedded assets
        shell: pwsh
        run: ./scripts/check-repository.ps1
      - name: Report embedded asset sizes
        shell: pwsh
        run: |
          $report = Get-Content -Raw -Encoding utf8 dist/build-size-report.json | ConvertFrom-Json
          Write-Host ("[Size] Readable bytes: {0}; Self-extract bytes: {1}" -f $report.readableHtmlBytes, $report.selfExtractHtmlBytes)
          foreach ($entry in @($report.assets | Sort-Object storedBytes -Descending)) {
            Write-Host ("[AssetSize] {0}/{1}: raw={2} stored={3} codec={4}" -f $entry.dependency, $entry.key, $entry.originalBytes, $entry.storedBytes, $entry.compression)
          }
      - name: Verify tracking state machine and line geometry
        shell: pwsh
        run: node scripts/test-tracker.mjs
      - name: Install browser test driver (CI only)
        shell: pwsh
        run: npm install --prefix .smoke --no-save --ignore-scripts playwright@1.56.1
      - name: Verify embedded model/WASM with synthetic camera in Chrome
        shell: pwsh
        run: node scripts/smoke-browser.mjs
