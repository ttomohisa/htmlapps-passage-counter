<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval' blob:; style-src 'unsafe-inline'; img-src data: blob:; connect-src blob:; worker-src blob:; base-uri 'none'; form-action 'none'; object-src 'none';">
<title>LiteRT × EfficientDet — offline trial</title><style>
:root{font:15px/1.5 system-ui,sans-serif;background:#f5f8f6;color:#193328}
body{margin:0;padding:16px}main{max-width:760px;margin:auto}
section{border:1px solid #cadbd1;border-radius:12px;background:white;padding:16px;margin:12px 0}
h1{font-size:1.4rem}button{background:#16624f;color:white;padding:12px 18px;border:0;border-radius:10px;min-height:44px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}
</style></head><body><main>
<h1>LiteRT.js / EfficientDet-Lite0 int8</h1>
<p>Standalone offline compatibility test. This is not the published person counter.</p>
<section><p id="mode"></p><button type="button" id="runButton">Compile and run current model</button><p id="status" role="status">Ready</p><pre id="result"></pre></section>
<p>Model and WASM are embedded. This test does not establish human detection accuracy.</p>
</main>
<script id="bundle" type="application/json">__TRIAL_ASSETS__</script>
<script>
(() => {
 'use strict';
 const assets=JSON.parse(document.querySelector('#bundle').textContent);
 const mode=new URLSearchParams(location.search).get('mode')==='compat'?'compat':'optimized';
 document.querySelector('#mode').textContent='Variant: '+mode;
 const state=window.__litertTrial={mode,done:false,ok:false,report:null,error:null,stage:'idle',violations:[]};
 document.addEventListener('securitypolicyviolation',e=>{
   state.violations.push({directive:e.violatedDirective,blockedURI:e.blockedURI,sourceFile:e.sourceFile});
 });
 let runtime=null,model=null;
 const urls=[];
 function blobUrl(data,type){
   const url=URL.createObjectURL(new Blob([data],{type}));
   urls.push(url);return url;
 }
 async function unpack(key){
   const a=assets[key];
   if(!a)throw Error('Missing asset '+key);
   const raw=atob(a.base64),bytes=new Uint8Array(raw.length);
   for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
   const decoded=new Uint8Array(await new Response(
     new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))
   ).arrayBuffer());
   if(decoded.length!==a.bytes)throw Error('Decoded asset size mismatch '+key);
   return decoded;
 }
 function inputData(dtype,size){
   const arrayType={uint8:Uint8Array,int8:Int8Array,float32:Float32Array,int32:Int32Array}[dtype];
   if(!arrayType)throw Error('Unexpected input type '+dtype);
   const result=new arrayType(size);if(dtype==='uint8')result.fill(127);
   return result;
 }
 async function run(){
   const button=document.querySelector('#runButton');button.disabled=true;
   const status=document.querySelector('#status'),out=document.querySelector('#result');
   const start=performance.now();let input=null;
   state.stage='started';
   try{
     status.textContent='Unpacking embedded runtime';
     const moduleUrl=blobUrl(await unpack('core.mjs'),'text/javascript');
     state.stage='import-core';
     runtime=await import(moduleUrl);
     const wasmUrl=blobUrl(await unpack(mode+'.wasm'),'application/wasm');
     const loaderUrl=blobUrl(await unpack(mode+'-loader.js'),'text/javascript');
     state.stage='setup-loader';
     globalThis.Module={locateFile(name){
       if(name.endsWith('.wasm'))return wasmUrl;
       throw Error('Undeclared companion file '+name);
     },mainScriptUrlOrBlob:loaderUrl};
     status.textContent='Initializing LiteRT';
     state.stage='load-wasm-loader';
     // LiteRT treats a path without .js suffix as a directory and appends
     // litert_wasm_internal.js. Blob URLs have UUID endings, so use a harmless
     // fragment suffix to mark the direct JS file; Blob lookup ignores fragments.
     await runtime.loadLiteRt(loaderUrl+'#'+(mode==='compat'?'litert_wasm_compat_internal.js':'litert_wasm_internal.js'));
     state.stage='wasm-loaded';
     const initMs=performance.now()-start;
     status.textContent='Compiling unchanged official model';
     state.stage='compile-model';
     model=await runtime.loadAndCompile(await unpack('model.tflite'),{
       accelerator:'wasm',cpuOptions:{numThreads:1}
     });
     const compileMs=performance.now()-start;
     state.stage='inspect-tensors';
     const inputRaw=model.getInputDetails(),outputRaw=model.getOutputDetails();
     function detailsOf(items){
       return items.map(x=>{
         const dimensionValues=x.shape??x.dimensions??x.dims??x.tensorShape;
         return {name:x.name,dtype:x.dtype,shape:Array.from(dimensionValues??[]),
           availableKeys:Object.keys(x),type:typeof x,
           json:JSON.stringify(x)};
       });
     }
     const inputs=detailsOf(inputRaw),outputs=detailsOf(outputRaw);
     console.log('[litert][IO] inputs '+JSON.stringify(inputs));
     console.log('[litert][IO] outputs '+JSON.stringify(outputs));
     state.io={inputs,outputs};
     if(!inputs[0]?.shape?.length)throw Error('Input dimensions unavailable on public model details object.');
     if(inputs.length!==1)throw Error('Unexpected number of inputs '+inputs.length);
     const shape=inputs[0].shape;
     input=new runtime.Tensor(inputData(inputs[0].dtype,shape.reduce((a,b)=>a*b,1)),shape,inputs[0].dtype);
     const times=[];let samples=[];
     for(let i=0;i<3;i++){
       const tick=performance.now();
       const r=await model.run(input);times.push(Math.round((performance.now()-tick)*100)/100);
       const tensors=Array.isArray(r)?r:Object.values(r);
       try{
         samples=tensors.map(x=>({dtype:x.dtype,shape:Array.from(x.shape),
           first:Array.from(x.toTypedArray().slice(0,6),v=>typeof v==='bigint'?String(v):v)}));
       }finally{for(const x of tensors)x.delete();}
     }
     state.stage='complete';state.ok=true;state.report={mode,initMs,compileMs,inputDetails:inputs,
       outputDetails:outputs,timesMs:times,samples,totalMs:performance.now()-start};
     status.textContent='SUCCESS: model compiled and inferred';
     out.textContent=JSON.stringify(state.report,null,2);
   }catch(e){
     state.error=String(e?.stack||e)+' (stage='+state.stage+')';
     status.textContent='FAILED: '+String(e?.message||e);
     out.textContent=state.error;
     console.error('[litert-trial]',e);
   }finally{
     if(input)input.delete();
     if(model)model.delete();
     if(runtime?.unloadLiteRt)try{runtime.unloadLiteRt();}catch{}
     for(const url of urls)URL.revokeObjectURL(url);
     state.done=true;
   }
 }
 document.querySelector('#runButton').addEventListener('click',run);
})();
</script></body></html>
